<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Permainan Sebutan: Tempat di Bandar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      touch-action: manipulation;
      background-color: #f0fdf4;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-game {
      font-family: 'Fredoka One', cursive;
    }

    /* Animasi Butang Mikrofon Semasa Mendengar */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-recording {
      animation: pulse-ring 1.5s infinite;
      background-color: #ef4444 !important;
      border-color: #fca5a5 !important;
    }

    /* Canvas Frame */
    #gameCanvas {
      width: 100%;
      height: 220px;
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
    }

    .btn-bounce {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-bounce:active {
      transform: scale(0.95);
    }

    /* Bubble Percakapan */
    .speech-bubble {
      position: relative;
      background: #ffffff;
      border-radius: 1.25rem;
      border: 4px solid #3b82f6;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -14px;
      left: 50%;
      width: 0;
      height: 0;
      border: 14px solid transparent;
      border-top-color: #3b82f6;
      border-bottom: 0;
      margin-left: -14px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-3 sm:p-5 max-w-md md:max-w-2xl mx-auto">

  <!-- Amaran HTTPS untuk Safari / iOS -->
  <div id="httpsWarning" class="hidden w-full bg-amber-500 text-white text-xs text-center py-2 px-3 rounded-xl mb-2 font-bold shadow-sm">
    ⚠️ Nota: Akses mikrofon memerlukan sambungan HTTPS pada Safari iOS / Chrome Android.
  </div>

  <!-- Papan Skor & Tahap -->
  <header class="w-full bg-white rounded-2xl p-4 shadow-md border-2 border-green-200 flex justify-between items-center mb-3">
    <div class="flex items-center space-x-2">
      <span class="text-3xl">🚗</span>
      <div>
        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Tahap</div>
        <div id="levelDisplay" class="text-xl font-game text-green-600">Tahap 1 / 10</div>
      </div>
    </div>
    
    <div class="flex items-center space-x-2 bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-200">
      <span class="text-2xl">⭐</span>
      <div>
        <div class="text-[10px] text-amber-600 font-bold uppercase tracking-wider">Markah</div>
        <div id="scoreDisplay" class="text-xl font-game text-amber-500">0</div>
      </div>
    </div>
  </header>

  <!-- Kawasan Canvas Permainan -->
  <div class="w-full relative mb-3">
    <canvas id="gameCanvas" width="600" height="220"></canvas>
    
    <!-- Banner Status -->
    <div id="statusBanner" class="absolute top-3 left-1/2 transform -translate-x-1/2 bg-black/75 text-white text-xs sm:text-sm font-semibold px-4 py-1.5 rounded-full shadow-lg backdrop-blur-sm transition-all duration-300 z-10 text-center">
      Kereta sedang bergerak...
    </div>
  </div>

  <!-- Kad Ayat & Kawalan Sebutan -->
  <main class="w-full bg-white rounded-3xl p-5 shadow-lg border-2 border-blue-100 flex flex-col items-center flex-grow justify-between relative overflow-hidden">
    
    <!-- Paparan Tempat & Ayat -->
    <div class="w-full text-center my-auto py-2">
      <div id="placeIcon" class="text-5xl sm:text-6xl mb-2 animate-bounce">🏫</div>
      <div class="speech-bubble p-4 sm:p-5 shadow-sm mb-3">
        <p id="targetSentence" class="text-lg sm:text-2xl font-bold text-gray-800 leading-relaxed">
          SJKT Perak River Valley itu cantik.
        </p>
      </div>

      <!-- Paparan Hasil Sebutan -->
      <div id="speechResultBox" class="min-h-[2.5rem] flex items-center justify-center">
        <p id="speechResult" class="text-sm font-semibold text-gray-500 italic">
          Tekan butang mikrofon dan sebut ayat di atas.
        </p>
      </div>
    </div>

    <!-- Panel Butang Pengecaman Suara -->
    <div class="w-full flex flex-col items-center mt-2 space-y-3">
      
      <!-- Butang Mikrofon Utama (Push-To-Talk) -->
      <button id="micBtn" class="btn-bounce w-20 h-20 sm:w-24 sm:h-24 bg-blue-500 hover:bg-blue-600 text-white rounded-full flex flex-col items-center justify-center shadow-lg border-4 border-blue-200 transition-all focus:outline-none">
        <svg id="micIcon" class="w-8 h-8 sm:w-10 sm:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
        </svg>
        <span id="micText" class="text-[10px] sm:text-xs font-bold uppercase tracking-wider mt-1">Sebut</span>
      </button>

      <!-- Butang Tahap Seterusnya (Muncul bila jawapan betul) -->
      <button id="nextBtn" class="hidden btn-bounce w-full py-3.5 bg-green-500 hover:bg-green-600 text-white font-game text-lg sm:text-xl rounded-2xl shadow-lg border-b-4 border-green-700 transition-all flex items-center justify-center space-x-2">
        <span>TAHAP SETERUSNYA</span>
        <span>➡️</span>
      </button>

      <!-- Pintasan / Fallback untuk Safari / Masalah Mikrofon -->
      <div class="w-full text-center pt-2 border-t border-gray-100">
        <button id="bypassBtn" class="text-xs text-purple-600 font-bold hover:underline bg-purple-50 px-3 py-1.5 rounded-lg border border-purple-200">
          ⚡ Guna Mod Simulasi (Langkau Sebutan)
        </button>
      </div>

    </div>
  </main>

  <!-- Modal Penamat / Dialog -->
  <div id="modalOverlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border-4 border-amber-300 transform transition-all scale-100">
      <div id="modalIcon" class="text-6xl mb-3">🎉</div>
      <h2 id="modalTitle" class="text-2xl font-game text-gray-800 mb-2">Tahniah!</h2>
      <p id="modalMessage" class="text-gray-600 mb-6 text-sm font-medium">Anda telah menyelesaikan semua tahap dengan cemerlang!</p>
      <button id="modalBtn" class="btn-bounce w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-game text-lg rounded-2xl shadow-md border-b-4 border-amber-700">
        MAIN SEMULA
      </button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. DATA SOALAN & PEMBOLEH UBAH
       ========================================================================== */
    const levelsData = [
      { sentence: "SJKT Perak River Valley itu cantik.", icon: "🏫" },
      { sentence: "Taman ini besar dan hijau.", icon: "🌳" },
      { sentence: "Perpustakaan itu sunyi dan bersih.", icon: "📚" },
      { sentence: "Pasar itu sibuk dan bising.", icon: "🛒" },
      { sentence: "Pusat membeli-belah itu besar dan terang.", icon: "🏢" },
      { sentence: "Muzium itu lama tetapi menarik.", icon: "🏛️" },
      { sentence: "Hospital itu besar dan moden.", icon: "🏥" },
      { sentence: "Taman permainan itu berwarna-warni.", icon: "🎡" },
      { sentence: "Stesen kereta api itu sibuk.", icon: "🚂" },
      { sentence: "Bandar ini cantik dan bersih.", icon: "🏙️" }
    ];

    let currentLevel = 0;
    let score = 0;
    let isListening = false;
    let hasAnsweredCorrectly = false;

    // Semakan protokol HTTPS
    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      document.getElementById('httpsWarning').classList.remove('hidden');
    }

    /* ==========================================================================
       2. WEB AUDIO API (SYNTHESIZER SOUND EFFECTS)
       ========================================================================== */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSuccessSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, now + index * 0.08);
          gain.gain.linearRampToValueAtTime(0.2, now + index * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + index * 0.08);
          osc.stop(now + index * 0.08 + 0.25);
        });
      } catch (e) { console.error(e); }
    }

    function playCrashSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      } catch (e) { console.error(e); }
    }

    /* ==========================================================================
       3. CANVAS LUKISAN ANIMASI & BANDAR
       ========================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let carX = 30;
    const carY = 140;
    const targetObstacleX = 420;
    let carState = 'approaching'; // 'approaching', 'stopped', 'jumping', 'crashed'
    let carYOffset = 0;
    let carAngle = 0;
    let bgOffset = 0;

    const clouds = [
      { x: 50, y: 30, speed: 0.2, size: 25 },
      { x: 250, y: 20, speed: 0.15, size: 35 },
      { x: 480, y: 40, speed: 0.25, size: 20 }
    ];

    function drawCityBackground() {
      // Langit
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#7dd3fc');
      skyGrad.addColorStop(1, '#e0f2fe');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Awan
      ctx.fillStyle = '#ffffff';
      clouds.forEach(cloud => {
        cloud.x -= cloud.speed;
        if (cloud.x + cloud.size < 0) cloud.x = canvas.width + cloud.size;
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
        ctx.arc(cloud.x + cloud.size * 0.7, cloud.y - cloud.size * 0.2, cloud.size * 0.8, 0, Math.PI * 2);
        ctx.arc(cloud.x - cloud.size * 0.7, cloud.y - cloud.size * 0.2, cloud.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
      });

      // Bangunan Kartun
      const buildings = [
        { x: 10, w: 60, h: 90, color: '#fca5a5' },
        { x: 80, w: 50, h: 110, color: '#fde047' },
        { x: 140, w: 70, h: 80, color: '#86efac' },
        { x: 220, w: 55, h: 100, color: '#93c5fd' },
        { x: 285, w: 65, h: 120, color: '#c084fc' },
        { x: 360, w: 50, h: 85, color: '#fdba74' },
        { x: 420, w: 80, h: 105, color: '#a7f3d0' },
        { x: 510, w: 75, h: 95, color: '#f472b6' }
      ];

      buildings.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, canvas.height - 50 - b.h, b.w, b.h);
        ctx.fillStyle = '#ffffff';
        for (let wx = b.x + 8; wx < b.x + b.w - 10; wx += 16) {
          for (let wy = canvas.height - 50 - b.h + 12; wy < canvas.height - 60; wy += 20) {
            ctx.fillRect(wx, wy, 8, 10);
          }
        }
      });

      // Jalan Raya
      ctx.fillStyle = '#475569';
      ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

      // Garisan Putu Putus Jalan
      ctx.strokeStyle = '#fde047';
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 15]);
      ctx.lineDashOffset = -bgOffset;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 25);
      ctx.lineTo(canvas.width, canvas.height - 25);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawObstacle() {
      const x = targetObstacleX;
      const y = canvas.height - 85;

      // Kon Halangan (Traffic Barrier)
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(x + 10, y);
      ctx.lineTo(x + 30, y);
      ctx.lineTo(x + 35, y + 35);
      ctx.lineTo(x + 5, y + 35);
      ctx.closePath();
      ctx.fill();

      // Jalur
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + 11, y + 10, 18, 6);
      ctx.fillRect(x + 8, y + 22, 24, 6);

      // Tapak
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(x, y + 35, 40, 6);
    }

    function drawCar(x, y) {
      ctx.save();
      ctx.translate(x + 30, y + 15 + carYOffset);
      ctx.rotate(carAngle);

      // Badan Kereta (Menghadap Ke Kanan)
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.roundRect(-30, -15, 60, 25, 8);
      ctx.fill();

      // Bumbung
      ctx.fillStyle = '#60a5fa';
      ctx.beginPath();
      ctx.roundRect(-18, -27, 36, 15, 6);
      ctx.fill();

      // Cermin
      ctx.fillStyle = '#e0f2fe';
      ctx.fillRect(2, -24, 12, 10);
      ctx.fillRect(-14, -24, 12, 10);

      // Lampu Hadapan (Kanan)
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(28, -2, 4, 0, Math.PI * 2);
      ctx.fill();

      // Roda
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-16, 12, 8, 0, Math.PI * 2);
      ctx.arc(16, 12, 8, 0, Math.PI * 2);
      ctx.fill();

      // Rim
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.arc(-16, 12, 3, 0, Math.PI * 2);
      ctx.arc(16, 12, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function animateGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCityBackground();
      drawObstacle();

      if (carState === 'approaching') {
        if (carX < targetObstacleX - 70) {
          carX += 2.5;
          bgOffset += 2.5;
          carYOffset = Math.sin(Date.now() / 100) * 2;
        } else {
          carState = 'stopped';
          carYOffset = 0;
          setStatusBanner("Sebut ayat dengan betul untuk melepasi halangan!");
        }
      } else if (carState === 'jumping') {
        carX += 3.5;
        if (carX < targetObstacleX + 80) {
          const progress = (carX - (targetObstacleX - 70)) / 150;
          carYOffset = -Math.sin(progress * Math.PI) * 50;
          carAngle = -Math.sin(progress * Math.PI) * 0.2;
        } else {
          carYOffset = 0;
          carAngle = 0;
          carState = 'passed';
          setStatusBanner("Tahniah! Sebutan Tepat! 🎉");
        }
      } else if (carState === 'crashed') {
        carYOffset = Math.sin(Date.now() / 30) * 4;
        carAngle = 0.15;
      }

      drawCar(carX, carY);
      requestAnimationFrame(animateGame);
    }

    /* ==========================================================================
       4. LOGIK TOLERANSI SEBUTAN (LEVENSHTEIN DISTANCE)
       ========================================================================== */
    function normalizeText(text) {
      return text
        .toLowerCase()
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function calculateSimilarity(s1, s2) {
      const str1 = normalizeText(s1);
      const str2 = normalizeText(s2);

      if (str1 === str2) return 1.0;
      if (str1.length === 0 || str2.length === 0) return 0.0;

      const track = Array(str2.length + 1).fill(null).map(() =>
        Array(str1.length + 1).fill(null));

      for (let i = 0; i <= str1.length; i += 1) track[0][i] = i;
      for (let j = 0; j <= str2.length; j += 1) track[j][0] = j;

      for (let j = 1; j <= str2.length; j += 1) {
        for (let i = 1; i <= str1.length; i += 1) {
          const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
          track[j][i] = Math.min(
            track[j][i - 1] + 1,
            track[j - 1][i] + 1,
            track[j - 1][i - 1] + indicator
          );
        }
      }

      const distance = track[str2.length][str1.length];
      const maxLength = Math.max(str1.length, str2.length);
      return (maxLength - distance) / maxLength;
    }

    function evaluateSpeech(spokenText) {
      const target = levelsData[currentLevel].sentence;
      const similarity = calculateSimilarity(spokenText, target);

      console.log(`Spoken: "${spokenText}" | Target: "${target}" | Score: ${similarity}`);

      // Terima jika kejituan >= 70%
      if (similarity >= 0.70 || spokenText.toLowerCase().includes(target.toLowerCase().substring(0, 8))) {
        handleSuccess(spokenText);
      } else {
        handleFailure(spokenText);
      }
    }

    function handleSuccess(spokenText) {
      playSuccessSound();
      carState = 'jumping';
      hasAnsweredCorrectly = true;

      score += 10;
      scoreDisplay.textContent = score;

      speechResult.textContent = `" ${spokenText} "`;
      speechResult.className = "text-base font-bold text-green-600";

      micBtn.classList.add('hidden');
      nextBtn.classList.remove('hidden');
    }

    function handleFailure(spokenText) {
      playCrashSound();
      carState = 'crashed';

      speechResult.textContent = spokenText ? `Dengar: "${spokenText}". Sila cuba lagi!` : "Tiada suara dikesan. Sila cuba lagi.";
      speechResult.className = "text-base font-bold text-red-500 animate-pulse";

      setStatusBanner("Kereta terlanggar halangan! Sila cuba semula.");

      setTimeout(() => {
        if (!hasAnsweredCorrectly) {
          carState = 'stopped';
          carYOffset = 0;
          carAngle = 0;
        }
      }, 1500);
    }

    /* ==========================================================================
       5. SPEECH RECOGNITION & PUSH-TO-TALK
       ========================================================================== */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "ms-MY";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        isListening = true;
        micBtn.classList.add('mic-recording');
        micText.textContent = "Mendengar...";
        speechResult.textContent = "Sila sebut ayat sekarang...";
        speechResult.className = "text-sm font-semibold text-blue-600 animate-pulse";
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        evaluateSpeech(transcript);
      };

      recognition.onerror = function(event) {
        console.error("Speech Recognition Error:", event.error);
        if (event.error === 'no-speech') {
          speechResult.textContent = "Tiada suara dikesan. Sila cuba lagi.";
        } else if (event.error === 'not-allowed') {
          speechResult.textContent = "Sila benarkan akses mikrofon untuk bermain permainan ini.";
        } else {
          speechResult.textContent = "Ralat pengecaman suara. Sila cuba lagi atau guna Mod Simulasi.";
        }
        speechResult.className = "text-sm font-bold text-amber-600";
        stopListeningState();
      };

      recognition.onend = function() {
        stopListeningState();
      };
    }

    function stopListeningState() {
      isListening = false;
      micBtn.classList.remove('mic-recording');
      micText.textContent = "SEBUT";
    }

    async function startListening() {
      if (!SpeechRecognition) {
        speechResult.textContent = "Pelayar ini tidak menyokong pengecaman suara. Sila gunakan Google Chrome.";
        speechResult.className = "text-sm font-bold text-red-500";
        return;
      }

      // Permohonan Akses Mikrofon Eksplisit (iOS/Safari Support)
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(track => track.stop());
        }
        recognition.start();
      } catch (err) {
        console.error("Mic Access Error:", err);
        speechResult.textContent = "Sila benarkan akses mikrofon untuk bermain permainan ini.";
        speechResult.className = "text-sm font-bold text-red-500";
      }
    }

    /* ==========================================================================
       6. KAWALAN PERMAINAN & UI EVENTS
       ========================================================================== */
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const targetSentence = document.getElementById('targetSentence');
    const placeIcon = document.getElementById('placeIcon');
    const speechResult = document.getElementById('speechResult');
    const statusBanner = document.getElementById('statusBanner');

    const micBtn = document.getElementById('micBtn');
    const micText = document.getElementById('micText');
    const nextBtn = document.getElementById('nextBtn');
    const bypassBtn = document.getElementById('bypassBtn');

    function loadLevel(levelIndex) {
      hasAnsweredCorrectly = false;
      const data = levelsData[levelIndex];

      levelDisplay.textContent = `Tahap ${levelIndex + 1} / ${levelsData.length}`;
      targetSentence.textContent = data.sentence;
      placeIcon.textContent = data.icon;
      speechResult.textContent = "Tekan butang mikrofon dan sebut ayat di atas.";
      speechResult.className = "text-sm font-semibold text-gray-500 italic";

      nextBtn.classList.add('hidden');
      micBtn.classList.remove('hidden');

      carX = 30;
      carYOffset = 0;
      carAngle = 0;
      carState = 'approaching';
      setStatusBanner("Kereta sedang bergerak...");
    }

    function setStatusBanner(msg) {
      statusBanner.textContent = msg;
    }

    micBtn.addEventListener('click', () => {
      initAudio();
      if (!isListening) {
        startListening();
      } else {
        recognition.stop();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentLevel < levelsData.length - 1) {
        currentLevel++;
        loadLevel(currentLevel);
      } else {
        showModal(
          "🏆 TAHNIAH! SYABAS!",
          `Anda telah berjaya menyelesaikan semua 10 tahap tempat di bandar!\n\nJumlah Markah Akhir: ${score} / 100`,
          "MAIN SEMULA"
        );
      }
    });

    // Mod Pintasan / Simulasi Sekiranya Mikrofon Disekat
    bypassBtn.addEventListener('click', () => {
      evaluateSpeech(levelsData[currentLevel].sentence);
    });

    // Modal Manager
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const modalBtn = document.getElementById('modalBtn');

    function showModal(title, msg, btnText) {
      modalTitle.textContent = title;
      modalMessage.innerText = msg;
      modalBtn.textContent = btnText;
      modalOverlay.classList.remove('hidden');
    }

    modalBtn.addEventListener('click', () => {
      modalOverlay.classList.add('hidden');
      if (currentLevel >= levelsData.length - 1 && hasAnsweredCorrectly) {
        currentLevel = 0;
        score = 0;
        scoreDisplay.textContent = score;
        loadLevel(0);
      }
    });

    window.onload = function() {
      requestAnimationFrame(animateGame);
      loadLevel(0);
    };
  </script>
</body>
</html>
